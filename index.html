<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人學術與作品集｜Research & Portfolio</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #eff6ff;
            --accent: #0284c7;
            --dark: #0f172a;
            --text: #334155;
            --muted: #64748b;
            --bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        /* 頂部導覽列 */
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .nav-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--dark);
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            display: flex;
            gap: 1.75rem;
            list-style: none;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-menu a:hover {
            color: var(--primary);
        }

        /* 個人簡介區 (Hero) */
        .profile-section {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 4.5rem 1.5rem;
        }

        .profile-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .avatar-box {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 800;
            flex-shrink: 0;
            box-shadow: 0 10px 25px rgba(30, 64, 175, 0.2);
        }

        .profile-info {
            flex: 1;
            min-width: 280px;
        }

        .profile-info h1 {
            font-size: 2.2rem;
            color: var(--dark);
            margin-bottom: 0.4rem;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .bio {
            color: var(--text);
            margin-bottom: 1.5rem;
            max-width: 680px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.3rem 0.85rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .action-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.35rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: #1e3a8a;
        }

        .btn-outline {
            border: 1px solid var(--border);
            color: var(--dark);
            background: var(--white);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 內容主容器 */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3.5rem 1.5rem;
        }

        .section-block {
            margin-bottom: 4.5rem;
        }

            font-size: 1.65rem;
            color: var(--dark);
            font-weight: 800;
            margin-bottom: 0
